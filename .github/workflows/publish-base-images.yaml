name: publish-base-images

# Publish the base images by publishing a GitHub release tagged base-images-<tag>,
# where <tag> is the image tag in docker/base-images/docker-compose.yaml.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'base-images-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release against the image tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::The release commit is not on main."; exit 1; }
          image_tag="${RELEASE_TAG#base-images-}"
          images=$(cd docker/base-images && docker buildx bake --print | jq -r '.target[].tags[]')
          for image in $images; do
            if [ "${image##*:}" != "$image_tag" ]; then
              echo "::error::$image does not use the release tag $image_tag."; exit 1
            fi
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "::error::$image is already published."; exit 1
            fi
          done

      - name: Build and push the base images
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: docker/base-images
          files: docker-compose.yaml
          push: true
