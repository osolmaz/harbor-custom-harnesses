name: check-base-images

on:
  pull_request:
    paths:
      - "docker/base-images/**"
      - ".github/workflows/*base-images.yaml"
  push:
    branches:
      - main
    paths:
      - "docker/base-images/**"
      - ".github/workflows/*base-images.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the base images for linux/amd64
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: docker/base-images
          files: docker-compose.yaml
          set: "*.platform=linux/amd64"
          push: false
